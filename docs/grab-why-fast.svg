<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="抢课为什么快：把 5 个请求压成 1 个">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="470" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1079" height="469" rx="14" fill="none" stroke="#e5e7eb"/>

  <text x="32" y="44" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#111827">抢课为什么快：把 5 个请求压成 1 个</text>
  <text x="32" y="70" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#6b7280">实测单次请求往返 ≈ 250 ms（复用连接）/ 410 ms（新建连接）</text>

  <!-- ============ 旧做法 ============ -->
  <circle cx="37" cy="105" r="4" fill="#dc2626"/>
  <text x="48" y="110" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#6b7280">旧做法：等到 T0 才动手</text>

  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" fill="#991b1b" text-anchor="middle">
    <rect x="32" y="124" width="176" height="44" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="120" y="151">切 Tab</text>
    <rect x="222" y="124" width="176" height="44" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="310" y="151">查课程</text>
    <rect x="412" y="124" width="176" height="44" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="500" y="151">查教学班</text>
    <rect x="602" y="124" width="176" height="44" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="690" y="151">冲突预检</text>
    <rect x="792" y="124" width="176" height="44" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="880" y="151">提交</text>
  </g>
  <g stroke="#d1d5db" stroke-width="1.6" marker-end="url(#ar)">
    <line x1="209" y1="146" x2="219" y2="146"/>
    <line x1="399" y1="146" x2="409" y2="146"/>
    <line x1="589" y1="146" x2="599" y2="146"/>
    <line x1="779" y1="146" x2="789" y2="146"/>
  </g>

  <line x1="32" y1="182" x2="968" y2="182" stroke="#fecaca" stroke-width="2"/>
  <line x1="32" y1="182" x2="32" y2="176" stroke="#fecaca" stroke-width="2"/>
  <line x1="968" y1="182" x2="968" y2="176" stroke="#fecaca" stroke-width="2"/>
  <text x="32" y="204" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#b91c1c">T0 开始才依次发这 5 个请求 → 起跑就落后 5 个身位 ≈ 1.25 s，别人早抢完了</text>

  <!-- ============ 现在做法 ============ -->
  <circle cx="37" cy="245" r="4" fill="#059669"/>
  <text x="48" y="250" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#6b7280">现在：T0 那一刻只剩一个请求要发</text>

  <rect x="32" y="272" width="780" height="84" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="52" y="296" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="700" fill="#047857">预热相　T0 − 90 s 起</text>
  <text x="52" y="316" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#065f46">反复解析「教学班令牌」+ 抓最新上下文　·　只查询，不发任何写请求</text>
  <text x="52" y="333" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#065f46">采样间隔 1.5 倍退避（1.5 s → 8 s 封顶）：开放前查不到班，密集轮询没收益还招眼</text>
  <g fill="#34d399">
    <circle cx="76" cy="347" r="2.6"/>
    <circle cx="120" cy="347" r="2.6"/>
    <circle cx="180" cy="347" r="2.6"/>
    <circle cx="260" cy="347" r="2.6"/>
    <circle cx="360" cy="347" r="2.6"/>
    <circle cx="484" cy="347" r="2.6"/>
    <circle cx="628" cy="347" r="2.6"/>
    <circle cx="788" cy="347" r="2.6"/>
  </g>
  <line x1="76" y1="347" x2="788" y2="347" stroke="#d1fae5" stroke-width="1.4"/>

  <rect x="820" y="272" width="228" height="84" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="838" y="296" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="700" fill="#c2410c">开火相</text>
  <text x="838" y="316" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#9a3412">T0 − lead 起</text>
  <text x="838" y="334" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#9a3412">预检 + submit ×1</text>
  <text x="838" y="351" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#9a3412">一次往返定胜负</text>

  <line x1="990" y1="262" x2="990" y2="368" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="990" y="254" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#ea580c" text-anchor="middle">T0</text>

  <!-- ============ 结论 ============ -->
  <rect x="32" y="384" width="1016" height="62" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="52" y="410" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#3730a3">快不是因为并发，而是因为「T0 之前把一切准备好」</text>
  <text x="52" y="431" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#4338ca">做不到并发的原因：do_jxb_id 是一次性令牌 —— 并发会让「这个响应属于哪门课」变成配对难题；提前刷令牌还会当场作废手里那个。</text>
</svg>
