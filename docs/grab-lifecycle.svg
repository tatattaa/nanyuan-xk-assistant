<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" role="img" aria-label="一项的一生：RESOLVE 到 PRECHECK 到 SUBMIT，以及三类去向">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="580" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1079" height="579" rx="14" fill="none" stroke="#e5e7eb"/>

  <text x="32" y="44" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#111827">一项的一生：每个 tick 最多发一个请求</text>
  <text x="32" y="70" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#6b7280">RESOLVE → PRECHECK → SUBMIT 单向推进；全程单线程，任何时刻最多一个在途写请求</text>

  <!-- ============ 主链 ============ -->
  <rect x="32" y="112" width="70" height="44" rx="22" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="67" y="139" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#374151" text-anchor="middle">开始</text>

  <g stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a2)">
    <line x1="104" y1="134" x2="124" y2="134"/>
    <line x1="390" y1="134" x2="414" y2="134"/>
    <line x1="680" y1="134" x2="704" y2="134"/>
  </g>

  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif">
    <rect x="128" y="98" width="260" height="76" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="148" y="128" font-size="15" font-weight="700" fill="#111827">RESOLVE</text>
    <text x="148" y="150" font-size="12" fill="#4b5563">补齐教学班令牌 do_jxb_id</text>
    <text x="148" y="168" font-size="11.5" fill="#9ca3af">独立预算 3 次，不占提交次数额度</text>

    <rect x="418" y="98" width="260" height="76" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="438" y="128" font-size="15" font-weight="700" fill="#111827">PRECHECK</text>
    <text x="438" y="150" font-size="12" fill="#4b5563">冲突预检（零副作用查询）</text>
    <text x="438" y="168" font-size="11.5" fill="#9ca3af">空令牌 → 不发，直接进提交</text>

    <rect x="708" y="98" width="260" height="76" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="728" y="128" font-size="15" font-weight="700" fill="#9a3412">SUBMIT</text>
    <text x="728" y="150" font-size="12" fill="#7c2d12">提交（写请求），一次一发</text>
    <text x="728" y="168" font-size="11.5" fill="#c2410c">每 tick 最多 1 个在途请求</text>
  </g>

  <!-- 分支总线 -->
  <g stroke="#9ca3af" stroke-width="1.8" fill="none">
    <path d="M 838 174 L 838 214"/>
    <path d="M 206 214 L 874 214"/>
  </g>
  <g stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a2)">
    <line x1="206" y1="214" x2="206" y2="242"/>
    <line x1="540" y1="214" x2="540" y2="242"/>
    <line x1="874" y1="214" x2="874" y2="242"/>
  </g>

  <!-- ============ 三类去向 ============ -->
  <rect x="48" y="246" width="316" height="176" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="68" y="274" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#047857">✅ 抢到 → WON</text>
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#065f46">
    <text x="68" y="302">success：教务明确返回成功</text>
    <text x="68" y="326">flag="6"「该教学班已选中」</text>
    <text x="68" y="350">　→ 也算抢到（提交超时但其实已生效，</text>
    <text x="68" y="374">　　是这种情况的唯一发现路径）</text>
    <text x="68" y="402">日志写明「凭什么判定抢到」</text>
  </g>

  <rect x="382" y="246" width="316" height="176" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="402" y="274" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">↻ 再来一次（回到 SUBMIT）</text>
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#1e40af">
    <text x="402" y="302">加密串错误 → 同步重查令牌（≤3 次）</text>
    <text x="402" y="326">NETWORK（没说话）→ 退避 1→2→4→8s</text>
    <text x="402" y="350">TOO_FREQUENT → 放慢继续</text>
    <text x="402" y="374">　（它是「让我慢点」，不是「没名额」）</text>
    <text x="402" y="402">NOT_OPEN → 重抓上下文，耐心等 ≤30s</text>
  </g>

  <rect x="716" y="246" width="316" height="176" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="736" y="274" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#b91c1c">⛔ 放弃 → FAILED / SKIPPED</text>
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#991b1b">
    <text x="736" y="302">满员 → 终态，只发这一发（转蹲课）</text>
    <text x="736" y="326">UNKNOWN（说了话没归类）→ 立刻放弃</text>
    <text x="736" y="350">时间真冲突 → 预检拦下，零请求</text>
    <text x="736" y="374">达上限 20 次 / 超单项预算 / 超总时限</text>
  </g>

  <!-- ============ 两条纪律 ============ -->
  <rect x="32" y="442" width="1016" height="52" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="52" y="466" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">单线程的回报：响应天然属于当前项</text>
  <text x="52" y="485" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#6d28d9">同一时刻只有一个在途写请求 → submit() 返回时就地判定，这个响应一定属于正在 tick 的那一项，不需要任何「响应配对」算法。</text>

  <rect x="32" y="506" width="1016" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="52" y="530" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="700" fill="#15803d">抢到之后：不该发的请求一个都不发</text>
  <text x="52" y="549" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#166534">与它真的撞时间（星期 + 节次 + 周次三者都重叠）的其余项立刻跳过；只节次重叠、周次错开的照常提交 —— 那是两门都能上的课。</text>
</svg>
